<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор превью трека</title>
  <style>
    @font-face {
      font-family: 'TrackCustomFont';
      src: local('Arial Narrow'), local('Arial-Narrow'), local('sans-serif-condensed');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0b10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 50px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #161622;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.65);
      border: 1px solid #2b2b3d;
    }
    .field {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 13px; color: #aaa; font-weight: 500; }
    input[type="file"], input[type="text"], select, input[type="range"] {
      background: #222232;
      border: 1px solid #383850;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    input[type="range"] {
      padding: 4px 0;
      cursor: pointer;
    }
    .trim-box {
      background: #1c1c2a;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #2f2f44;
      margin-top: 4px;
    }
    .trim-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 8px;
      color: #ddd;
    }
    .time-badge {
      font-weight: 700;
      color: #ff3366;
      background: #28283c;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
    #waveCanvas {
      width: 100%;
      height: 54px;
      background: #111118;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      margin-bottom: 8px;
    }
    .preview-audio-btn {
      background: #28283a;
      color: #fff;
      border: 1px solid #3e3e56;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: background 0.2s;
    }
    .preview-audio-btn:hover { background: #34344c; }
    button#renderBtn {
      background: #ff3366;
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      margin-top: 14px;
      transition: background 0.2s;
    }
    button#renderBtn:hover { background: #e02456; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 14px; text-align: center; font-size: 14px; color: #888; }
    #renderCanvas { display: none; }

    #videoPreviewContainer {
      display: none;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #2a2a3e;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #previewVideoPlayer {
      width: 100%;
      max-width: 320px;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #33334c;
    }
    #downloadBtn {
      background: #28a745;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    #downloadBtn:hover {
      background: #218838;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #666680;
      max-width: 480px;
      line-height: 1.6;
    }
    footer a {
      color: #8c8ca6;
      text-decoration: underline;
      cursor: pointer;
      margin: 0 6px;
    }
    footer a:hover {
      color: #fff;
    }
    .privacy-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 11px;
      color: #55556e;
    }
    .privacy-notice svg {
      width: 14px;
      height: 14px;
      fill: #44aa66;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-content {
      background: #181824;
      border: 1px solid #2d2d42;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px 28px;
      box-sizing: border-box;
      position: relative;
    }
    .modal-content h3 {
      margin-top: 0;
      color: #fff;
      font-size: 18px;
      border-bottom: 1px solid #2d2d42;
      padding-bottom: 12px;
    }
    .modal-content h4 {
      margin-top: 16px;
      margin-bottom: 6px;
      color: #ff3366;
      font-size: 14px;
    }
    .modal-content p, .modal-content li {
      font-size: 13px;
      color: #bbb;
      line-height: 1.6;
    }
    .modal-content ul {
      padding-left: 20px;
      margin: 6px 0;
    }
    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
    }
    .modal-close-btn:hover {
      color: #fff;
    }
  </style>
  <script src="mp4-muxer.min.js"></script>
</head>
<body>
  <div class="card">
    <h2 style="margin-top:0; font-size: 20px;">Генератор превью трека</h2>
    
    <div class="field">
      <label>1. Фон (диджейский пульт / логотип):</label>
      <input type="file" id="bgInput" accept="image/*" />
    </div>

    <div class="field">
      <label>2. Обложка трека:</label>
      <input type="file" id="coverInput" accept="image/*" />
    </div>

    <div class="field">
      <label>3. Аудио трека (MP3 / WAV):</label>
      <input type="file" id="audioInput" accept="audio/*" />
    </div>

    <div class="field">
      <label>Название трека / Артист:</label>
      <input type="text" id="trackTitle" value="ARTIST - TRACK NAME" />
    </div>

    <div class="field">
      <label>Формат видео:</label>
      <select id="aspectRatioSelect">
        <option value="4:5" selected>4:5 (Посты Instagram — 1080x1350)</option>
        <option value="9:16">9:16 (Stories / Reels / TikTok — 1080x1920)</option>
        <option value="1:1">1:1 (Квадрат — 1080x1080)</option>
      </select>
    </div>

    <div class="field">
      <label>Тип анимации:</label>
      <select id="animationTypeSelect">
        <option value="sleeve_vinyl" selected>Выезд из конверта + вращение винила</option>
        <option value="only_vinyl">Только виниловая пластинка (по центру)</option>
        <option value="square_cover">Статичная квадратная обложка</option>
      </select>
    </div>

    <div class="field">
      <label>Длительность превью:</label>
      <select id="durationSelect">
        <option value="5">5 секунд</option>
        <option value="10">10 секунд</option>
        <option value="15">15 секунд</option>
        <option value="30" selected>30 секунд</option>
      </select>
    </div>

    <div class="field" id="trimSection">
      <label>Выбор куска для видео прямо на сайте:</label>
      <div class="trim-box">
        <div class="trim-header">
          <span>Отрезок видео:</span>
          <span class="time-badge" id="timeRangeDisplay">00:00 – 00:30</span>
        </div>
        <canvas id="waveCanvas" width="440" height="54"></canvas>
        <input type="range" id="startRange" min="0" max="100" value="0" step="0.5" style="width: 100%;" />
        <button type="button" class="preview-audio-btn" id="listenBtn">▶ Послушать выбранный отрезок</button>
      </div>
    </div>

    <button type="button" id="renderBtn">Сгенерировать превью</button>
    <div id="status">Загрузите файлы и выберите кусок трека</div>

    <div id="videoPreviewContainer">
      <label style="font-weight: 600; color: #fff;">Предпросмотр готового видео:</label>
      <video id="previewVideoPlayer" controls playsinline></video>
      <a id="downloadBtn" download="preview_track.mp4">⬇ Скачать готовое видео (MP4)</a>
    </div>
  </div>

  <canvas id="renderCanvas" width="1080" height="1350"></canvas>

  <footer>
    <div class="privacy-notice">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      <span>100% Client-Side: файлы обрабатываются локально без загрузки на сервер</span>
    </div>
    <div>
      <a onclick="openModal('privacy')">Конфиденциальность</a> • 
      <a onclick="openModal('terms')">Условия использования</a> • 
      <a onclick="openModal('licenses')">Лицензии</a>
    </div>
    <div style="margin-top: 6px; font-size: 11px;">
      © 2026 WZDQ Pool. Все права защищены.
    </div>
  </footer>

  <div class="modal-overlay" id="legalModal" onclick="closeModalOnBg(event)">
    <div class="modal-content">
      <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const legalDocs = {
      privacy: `
        <h3>Политика конфиденциальности (Privacy Policy)</h3>
        <p>Настоящее приложение работает по принципу <strong>Client-Side Only</strong> (вычисления исключительно на стороне клиента).</p>
        <h4>1. Обработка файлов</h4>
        <p>Любые аудиозаписи (MP3, WAV), изображения (JPG, PNG) и видеопотоки, выбираемые пользователем, обрабатываются непосредственно браузером через WebCodecs API и HTML5 Canvas. Ваши файлы <strong>не загружаются</strong>, не сохраняются и не передаются ни на какие внешние серверы или базы данных.</p>
        <h4>2. Сбор персональных данных</h4>
        <p>Сервис не осуществляет сбор, хранение, профилирование или передачу третьим лицам персональных данных, IP-адресов или информации о сессиях.</p>
        <h4>3. Локальное хранение</h4>
        <p>Сгенерированное видео MP4 формируется в оперативной памяти вашего браузера (Blob) и сразу скачивается на ваше устройство.</p>
      `,
      terms: `
        <h3>Условия использования (Terms of Service)</h3>
        <h4>1. Интеллектуальная собственность</h4>
        <p>Пользователь несет полную юридическую ответственность за наличие прав на использование, распространение и публикацию аудиозаписей, графических изображений и товарных знаков, загружаемых в генератор.</p>
        <h4>2. Ограничение ответственности</h4>
        <p>Инструмент предоставляется по принципу <em>«как есть» (AS IS)</em>. Разработчики не несут ответственности за возможные нарушения авторских и смежных прав со стороны конечного пользователя при размещении сгенерированных видеороликов в социальных сетях и на сторонних платформах.</p>
        <h4>3. Назначение сервиса</h4>
        <p>Инструмент предназначен для подготовки промо-материалов, тизеров и визуализаторов музыкальных треков для личного и профессионального использования.</p>
      `,
      licenses: `
        <h3>Лицензии и Open Source</h3>
        <h4>1. MP4 Muxer</h4>
        <p>Приложение использует библиотеку <code>mp4-muxer</code> под лицензией MIT License.</p>
        <p style="font-family: monospace; font-size: 11px; background: #111118; padding: 10px; border-radius: 6px;">
          Copyright (c) 2023-2026 Mp4-Muxer Contributors<br><br>
          Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction...
        </p>
        <h4>2. Шрифты и графика</h4>
        <p>Элементы визуального оформления, логотип WZDQ Pool и типографика используются в рамках промо-инструментария проекта.</p>
      `
    };

    function openModal(docType) {
      document.getElementById('modalBody').innerHTML = legalDocs[docType] || '';
      document.getElementById('legalModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('legalModal').style.display = 'none';
    }

    function closeModalOnBg(event) {
      if (event.target === document.getElementById('legalModal')) {
        closeModal();
      }
    }
  </script>

  <script src="app.js"></script>
</body>
</html>
